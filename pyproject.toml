[project]
name = "multimodal-rag"
version = "0.1.0"
description = "Professional Multimodal RAG System for PDF documents"
authors = [{ name = "Your Name" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "faiss-cpu>=1.10.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.45.0,<5.0.0",
    "torch>=2.2.0,<2.5.0",
    "gradio>=5.0.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
multimodal-rag = "multimodal_rag.cli:app"   # ← Fixed: points to typer app

[tool.uv]
dev-dependencies = ["multimodal-rag[dev]"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"